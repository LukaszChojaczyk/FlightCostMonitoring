name: Fetch flight prices

on:
  schedule:
    # Once a day at 05:23 UTC. 2 airport groups x 3 return dates x 31 days = 186 of the
    # 250 free searches; the script spends what is left on return-leg details for the cheapest deals.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      route_id:
        description: "Only fetch this route id (blank = all enabled routes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices from SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ROUTE_ID: ${{ inputs.route_id }}
        run: python scripts/fetch_prices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: flight prices $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
