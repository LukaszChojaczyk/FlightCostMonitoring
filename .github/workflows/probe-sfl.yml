name: Probe Stayforlong (temporary)
on:
  push:
    branches: [claude/project-thread-n6wrnx]
    paths: [probe/**, .github/workflows/probe-sfl.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: python -u probe/probe_sfl.py
